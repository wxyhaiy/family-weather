<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>家庭天气详情</title>
  <style>
    :root { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif; color: #172033; background: #f4f7fb; }
    body { margin: 0; min-height: 100vh; background: linear-gradient(160deg, #edf6ff, #f8fafc 48%, #eef5f1); }
    main { max-width: 720px; margin: 0 auto; padding: 24px 16px 48px; }
    section { background: rgba(255,255,255,.94); border: 1px solid #dce5ef; border-radius: 8px; box-shadow: 0 8px 24px rgba(34,58,85,.08); padding: 20px; margin-bottom: 14px; }
    .eyebrow { margin: 0 0 8px; color: #2774a8; font-size: 13px; font-weight: 700; }
    h1 { margin: 0; font-size: 26px; } h2 { margin: 0 0 14px; font-size: 18px; }
    .meta, .source { color: #637083; } .temp { margin-top: 20px; font-size: 40px; font-weight: 700; }
    .grid { display: grid; grid-template-columns: repeat(2, 1fr); gap: 10px; margin-top: 18px; }
    .metric { padding: 12px; background: #f5f8fb; border-radius: 6px; } .label { color: #718096; font-size: 12px; } .value { margin-top: 5px; font-weight: 650; }
    .note { line-height: 1.75; white-space: pre-wrap; } ul { padding-left: 20px; line-height: 1.8; }
    .error { color: #a33b3b; } @media (max-width: 480px) { h1 { font-size: 23px; } .temp { font-size: 34px; } }
  </style>
</head>
<body>
  <main id="app"><section><p class="eyebrow">家庭天气提醒</p><h1>正在加载详情</h1></section></main>
  <script>
    const app = document.getElementById('app');
    const esc = value => String(value == null ? '--' : value).replace(/[&<>"']/g, function(c) { return {'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]; });
    const metric = function(label, value) { return '<div class="metric"><div class="label">' + esc(label) + '</div><div class="value">' + esc(value) + '</div></div>'; };
    try {
      const raw = new URLSearchParams(location.search).get('data');
      if (!raw) throw new Error('缺少天气数据');
      const data = JSON.parse(raw), r = data.recipient, w = data.weather;
      const rain = (w.rain_hours || []).map(function(item) { return '<li>' + esc(item) + '</li>'; }).join('');
      const modeLabels = {morning: '早间提醒', noon: '午间提醒', afternoon: '下午提醒', evening: '晚间提醒'};
      app.innerHTML = '<section><p class="eyebrow">' + esc(modeLabels[data.mode] || '天气提醒') + '</p><h1>' + esc(r.name) + '的天气详情</h1><p class="meta">' + esc(r.city_name) + '</p><div class="temp">' + esc(w.emoji) + ' ' + esc(w.temp) + '℃</div><div class="grid">' + metric('天气', w.text) + metric('高 / 低温', w.temp_max + '℃ / ' + w.temp_min + '℃') + metric('体感 / 湿度', w.feels_like + '℃ / ' + w.humidity + '%') + metric('风向风力', w.wind_dir + ' ' + w.wind_scale + '级') + metric('AQI / 空气', w.aqi + ' / ' + w.air_category) + metric('紫外线', w.uv_index) + '</div></section><section><h2>出行提醒</h2><div class="note">' + esc(data.travel || data.note) + '</div></section><section><h2>未来降雨</h2><ul>' + rain + '</ul><p class="source">数据来自和风天气；AQI 不可用时会显示 --。</p></section>';
    } catch (error) { app.innerHTML = '<section><h1 class="error">暂时无法加载天气详情</h1><p>' + esc(error.message) + '</p></section>'; }
  </script>
</body>
</html>
