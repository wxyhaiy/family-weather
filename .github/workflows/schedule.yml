name: Daily Weather Push

on:
  schedule:
    # GitHub Actions uses UTC. 22:30 UTC = 06:30 China time; 14:00 UTC = 22:00 China time.
    - cron: '30 22 * * *'
    - cron: '0 14 * * *'


  # 允许在 GitHub 网页上手动触发
  workflow_dispatch:
    inputs:
      push_mode:
        description: '推送模式'
        required: true
        default: 'morning'
        type: choice
        options:
          - morning
          - evening

jobs:
  run-script:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'

      - name: Install Dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Determine Push Mode
        id: mode
        run: |
          if [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
            echo "push_mode=${{ github.event.inputs.push_mode }}" >> $GITHUB_OUTPUT
          else
            # The morning job runs at 22:30 UTC; the evening job runs at 14:00 UTC.
            HOUR=$(date -u +%H)
            MINUTE=$(date -u +%M)
            if [ "$HOUR" = "22" ] && [ "$MINUTE" = "30" ]; then
              echo "push_mode=morning" >> $GITHUB_OUTPUT
            else
              echo "push_mode=evening" >> $GITHUB_OUTPUT
            fi
          fi

      - name: Run Weather Script
        env:
          TZ: Asia/Shanghai
          # WeChat Official Account test account
          APP_ID: ${{ secrets.APP_ID }}
          APP_SECRET: ${{ secrets.APP_SECRET }}
          TEMPLATE_ID: ${{ secrets.TEMPLATE_ID }}
          USER_IDS: ${{ secrets.USER_IDS }}
          RECIPIENTS_JSON: ${{ secrets.RECIPIENTS_JSON }}
          # Gemini
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          GEMINI_MODEL: ${{ secrets.GEMINI_MODEL }}
          # 和风天气
          QWEATHER_API_KEY: ${{ secrets.QWEATHER_API_KEY }}
          QWEATHER_API_HOST: ${{ secrets.QWEATHER_API_HOST }}
          QWEATHER_PROJECT_ID: ${{ secrets.QWEATHER_PROJECT_ID }}
          QWEATHER_KEY_ID: ${{ secrets.QWEATHER_KEY_ID }}
          QWEATHER_PRIVATE_KEY: ${{ secrets.QWEATHER_PRIVATE_KEY }}
        run: |
          python main.py --mode ${{ steps.mode.outputs.push_mode }}
